version: '3.8'

services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      ADDR: ":8081"
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: reports-realm
      KEYCLOAK_CLIENT_ID: bionicpro-auth
      KEYCLOAK_CLIENT_SECRET: bionicpro-auth-secret-change-me
      REDIRECT_URI: http://localhost:8081/auth/callback
      FRONTEND_URL: http://localhost:3000
      REPORTS_API_URL: http://host.docker.internal:8000
      REDIS_ADDR: redis:6379
      SESSION_TTL_MINUTES: "30"
      TOKEN_ENCRYPTION_KEY: dev-only-32-byte-encryption-key!!
      COOKIE_SECURE: "false"
      SESSION_COOKIE_NAME: bionicpro_session
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - keycloak

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_AUTH_URL: http://localhost:8081
        REACT_APP_API_URL: http://localhost:8081
    ports:
      - "3000:3000"
    depends_on:
      - bionicpro-auth

volumes:
  redis-data:
