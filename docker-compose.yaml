services:
  crm_db:
    image: postgres:14
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
    volumes:
      - ./misc/crm-db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./misc/crm-db/crm.csv:/docker-entrypoint-initdb.d/crm.csv
      - crm-data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow_db:
    image: postgres:14
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  openldap:
    image: osixia/openldap:1.5.0
    container_name: openldap
    environment:
      LDAP_ORGANISATION: BionicPRO
      LDAP_DOMAIN: example.com
      LDAP_ADMIN_PASSWORD: admin
      LDAP_CONFIG_PASSWORD: config
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
      LDAP_TLS: "false"
      LDAP_READONLY_USER: "false"
    ports:
      - "389:389"
    volumes:
      - ./ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom
      - openldap-data:/var/lib/ldap
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost", "-b", "dc=example,dc=com", "-D", "cn=admin,dc=example,dc=com", "-w", "admin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      keycloak_db:
        condition: service_started
      openldap:
        condition: service_healthy

  keycloak-bootstrap:
    image: quay.io/keycloak/keycloak:21.1
    entrypoint: ["/bin/sh", "/opt/keycloak/bootstrap/keycloak-bootstrap-client.sh"]
    environment:
      KEYCLOAK_SERVER: http://keycloak:8080
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KEYCLOAK_REALM: reports-realm
      KEYCLOAK_CLIENT_ID: bionicpro-auth
      KEYCLOAK_CLIENT_SECRET: bionicpro-auth-secret-change-me
      REDIRECT_URI: http://localhost:8081/auth/callback
      FRONTEND_URL: http://localhost:3000
    volumes:
      - ./scripts/keycloak-bootstrap-client.sh:/opt/keycloak/bootstrap/keycloak-bootstrap-client.sh:ro
    depends_on:
      keycloak:
        condition: service_started

  profiles_db:
    image: postgres:14
    environment:
      POSTGRES_DB: profiles
      POSTGRES_USER: profiles
      POSTGRES_PASSWORD: profiles
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - profiles-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profiles -d profiles"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-init:
    image: apache/airflow:2.9.3
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_db:5432/airflow
      AIRFLOW_CONN_CRM_POSTGRES: postgresql://crm:crm@crm_db:5432/crm
      AIRFLOW_CONN_TELEMETRY_POSTGRES: postgresql://profiles:profiles@profiles_db:5432/profiles
      AIRFLOW_CONN_OLAP_POSTGRES: postgresql://profiles:profiles@profiles_db:5432/profiles
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
      - airflow-plugins:/opt/airflow/plugins
    depends_on:
      airflow_db:
        condition: service_healthy
      profiles_db:
        condition: service_healthy
      crm_db:
        condition: service_healthy

  airflow-webserver:
    image: apache/airflow:2.9.3
    command: webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_db:5432/airflow
      AIRFLOW_CONN_CRM_POSTGRES: postgresql://crm:crm@crm_db:5432/crm
      AIRFLOW_CONN_TELEMETRY_POSTGRES: postgresql://profiles:profiles@profiles_db:5432/profiles
      AIRFLOW_CONN_OLAP_POSTGRES: postgresql://profiles:profiles@profiles_db:5432/profiles
    ports:
      - "8088:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
      - airflow-plugins:/opt/airflow/plugins
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    image: apache/airflow:2.9.3
    command: scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_db:5432/airflow
      AIRFLOW_CONN_CRM_POSTGRES: postgresql://crm:crm@crm_db:5432/crm
      AIRFLOW_CONN_TELEMETRY_POSTGRES: postgresql://profiles:profiles@profiles_db:5432/profiles
      AIRFLOW_CONN_OLAP_POSTGRES: postgresql://profiles:profiles@profiles_db:5432/profiles
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
      - airflow-plugins:/opt/airflow/plugins
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  debezium-connect:
    image: debezium/connect:2.7.3.Final
    depends_on:
      kafka:
        condition: service_started
      crm_db:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_connect_configs
      OFFSET_STORAGE_TOPIC: debezium_connect_offsets
      STATUS_STORAGE_TOPIC: debezium_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      ENABLE_DEBEZIUM_SCRIPTING: "false"

  debezium-init:
    image: curlimages/curl:8.8.0
    depends_on:
      debezium-connect:
        condition: service_started
    entrypoint: ["/bin/sh", "/init/register-connector.sh"]
    volumes:
      - ./debezium/register-connector.sh:/init/register-connector.sh:ro
      - ./debezium/crm-connector.json:/init/crm-connector.json:ro

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9002:9000"
    environment:
      CLICKHOUSE_DB: olap
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d
    depends_on:
      kafka:
        condition: service_started

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio-data:/data

  reports-cdn:
    image: nginx:1.27-alpine
    ports:
      - "8082:80"
    volumes:
      - ./cdn/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - reports-cdn-cache:/var/cache/nginx/reports
    depends_on:
      minio:
        condition: service_started

  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      ADDR: ":8081"
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      KEYCLOAK_REALM: reports-realm
      KEYCLOAK_CLIENT_ID: bionicpro-auth
      KEYCLOAK_CLIENT_SECRET: bionicpro-auth-secret-change-me
      REDIRECT_URI: http://localhost:8081/auth/callback
      YANDEX_REDIRECT_URI: http://localhost:8081/auth/callback
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      FRONTEND_URL: http://localhost:3000
      REPORTS_API_URL: http://bionicpro-reports:8000
      REDIS_ADDR: redis:6379
      SESSION_TTL_MINUTES: "30"
      TOKEN_ENCRYPTION_KEY: dev-only-32-byte-encryption-key!!
      COOKIE_SECURE: "false"
      SESSION_COOKIE_NAME: bionicpro_session
      DATABASE_URL: postgres://profiles:profiles@profiles_db:5432/profiles?sslmode=disable
    depends_on:
      redis:
        condition: service_started
      keycloak:
        condition: service_started
      keycloak-bootstrap:
        condition: service_completed_successfully
      profiles_db:
        condition: service_healthy
      bionicpro-reports:
        condition: service_started

  bionicpro-reports:
    build:
      context: ./bionicpro-reports
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      ADDR: ":8000"
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: reports-realm
      CLICKHOUSE_DSN: clickhouse://default:clickhouse@clickhouse:9000?database=olap
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: reports
      S3_USE_SSL: "false"
      CDN_BASE_URL: http://localhost:8082/reports
      REPORTS_DATA_VERSION: v1
      CDN_MAX_AGE_SECONDS: "3600"
    depends_on:
      keycloak:
        condition: service_started
      clickhouse:
        condition: service_started
      minio:
        condition: service_started
      reports-cdn:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_AUTH_URL: http://localhost:8081
        REACT_APP_API_URL: http://localhost:8081
    ports:
      - "3000:3000"
    depends_on:
      - bionicpro-auth

volumes:
  crm-data:
  airflow-db-data:
  airflow-logs:
  airflow-plugins:
  redis-data:
  openldap-data:
  profiles-data:
  minio-data:
  reports-cdn-cache:
  clickhouse-data:
